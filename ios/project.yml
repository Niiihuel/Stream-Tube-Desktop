name: StreamTube
options:
  bundleIdPrefix: app.streamtube
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.7.5"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  StreamTube:
    type: application
    platform: iOS
    sources:
      - path: StreamTube
        excludes:
          - "Info.plist"
          - "Generated/*.h"
          - "Generated/*.modulemap"
    info:
      path: StreamTube/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.streamtube.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lc++"
          - "-lresolv"
    dependencies:
      - framework: Frameworks/StreamTubeCoreFFI.xcframework
        embed: false
      - sdk: AVKit.framework
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
